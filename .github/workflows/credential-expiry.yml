# Calls winui-app-kit's reusable credential reminder (CI-11), copied from the kit's caller example. It
# fails weekly from 60 days before the Store secret expires. The date is the organisation variable
# STORE_SECRET_EXPIRES, set whenever the secret is created or rotated. Keep the `uses:` tag equal to
# the external/winui-app-kit pin.
name: Credential Expiry

on:
  schedule:
    # Mondays at 13:00 UTC (9 a.m. Toronto in EDT, 8 a.m. in EST).
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-expiry
  cancel-in-progress: true

jobs:
  check:
    uses: Dynamic-Solutions-Canada/winui-app-kit/.github/workflows/credential-expiry.yml@v2.6.0
    with:
      expires: ${{ vars.STORE_SECRET_EXPIRES }}
